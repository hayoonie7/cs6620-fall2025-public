# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "week02" ]
  pull_request:
    branches: [ "week02" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Log into Dockerhub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/cs6620-app:latest
        labels: |
          org.opencontainers.image.source=${{ github.event.repository.html_url }}
          org.opencontainers.image.revision=${{ github.sha }}
          build.source=github-actions
          build.workflow=${{ github.workflow }}
          build.run_id=${{ github.run_id }}
          build.run_number=${{ github.run_number }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/cs6620-app:latest
      INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
      CONTAINER_NAME: cs6620-app
      CONTAINER_PORT: "5000"
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}
 
      - name: Send deploy command via SSM
        run: |
          PARAMS=$(jq -n \
            --arg img "$IMAGE" \
            --arg name "$CONTAINER_NAME" \
            --arg port "$CONTAINER_PORT" \
            '{commands: [
              "docker pull \($img)",
              "docker stop \($name) || true",
              "docker rm \($name) || true",
              "docker run -d --name \($name) --restart unless-stopped -p 80:\($port) \($img)",
              "docker image prune -f"
            ]}')
 
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy cs6620-app:latest from GitHub Actions run ${{ github.run_number }}" \
            --parameters "$PARAMS" \
            --query "Command.CommandId" \
            --output text)
 
          echo "SSM command ID: $COMMAND_ID"
          echo "COMMAND_ID=$COMMAND_ID" >> "$GITHUB_ENV"
 
      - name: Wait for deployment and show output
        run: |
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" || true
 
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "{Status: Status, Output: StandardOutputContent, Errors: StandardErrorContent}" \
            --output yaml
 
          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "Status" --output text)
 
          echo "Deployment status: $STATUS"
